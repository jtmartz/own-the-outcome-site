<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Own the Outcome</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='100' fill='%23201F1B'/%3E%3Ctext x='100' y='128' font-family='Georgia,serif' font-style='italic' font-weight='500' font-size='82' fill='%23FBF8F2' text-anchor='middle'%3EO%3Ctspan fill='%23DD7A45' font-family='Arial,sans-serif' font-style='normal' font-weight='700' font-size='62'%3Eo%3C/tspan%3E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF8F2;
    --paper: #FFFFFF;
    --ink: #201F1B;
    --ink-soft: #47453E;
    --muted: #7A776C;
    --line: #E6E0D2;
    --rust: #B14A2C;
    --bad: #B14A2C;
    --bad-bg: #F7E9E4;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--sans); color: var(--ink-soft); line-height: 1.6;
    background: var(--cream); -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a { color: inherit; }
  header.site { background: var(--paper); border-bottom: 1px solid var(--line); }
  .header-inner {
    display: flex; align-items: center; justify-content: center;
    padding: 22px 32px; max-width: 1080px; margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand .mark { width: 38px; height: 38px; flex: none; }
  .brand .wordmark { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 20px; color: var(--ink); }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .login-card {
    width: 100%; max-width: 400px; background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px; padding: 40px 36px;
  }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--rust); margin: 0 0 10px; text-align: center;
  }
  h1 {
    font-family: var(--serif); font-weight: 500; font-size: 26px; color: var(--ink);
    margin: 0 0 28px; text-align: center; letter-spacing: -0.01em;
  }
  .field-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 0 0 6px; }
  label.field-label:not(:first-child) { margin-top: 18px; }
  .field-input {
    width: 100%; font-family: var(--sans); font-size: 14.5px; color: var(--ink);
    background: var(--cream); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px;
  }
  .field-input:focus { outline: none; border-color: var(--rust); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; width: 100%;
    background: var(--ink); color: var(--cream); padding: 13px 24px; border-radius: 3px;
    text-decoration: none; font-weight: 600; font-size: 15px; border: 1px solid var(--ink);
    cursor: pointer; font-family: var(--sans); margin-top: 24px;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--rust); border-color: var(--rust); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .error-note {
    display: none; font-size: 13px; color: var(--bad); background: var(--bad-bg);
    border-radius: 3px; padding: 10px 14px; margin-top: 18px;
  }
  .error-note.show { display: block; }
  .back-link { text-align: center; margin-top: 22px; font-size: 13.5px; }
  .back-link a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; }
  .back-link a:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>

  <header class="site">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="94" fill="#14130F"/>
          <circle cx="100" cy="100" r="95" fill="none" stroke="#FBF8F2" stroke-width="6" opacity="0.9"/>
          <text x="100" y="138" font-family="Fraunces" font-style="italic" font-weight="500" font-size="114" fill="#FBF8F2" text-anchor="middle">O<tspan fill="#DD7A45" font-family="Inter" font-style="normal" font-weight="700" font-size="86">o</tspan></text>
        </svg>
        <div class="wordmark">Own the Outcome</div>
      </a>
    </div>
  </header>

  <main>
    <div class="login-card">
      <p class="eyebrow">Client Portal</p>
      <h1>Log in to your account</h1>
      <form id="loginForm">
        <label class="field-label" for="email">Email</label>
        <input class="field-input" id="email" type="email" autocomplete="username" required>

        <label class="field-label" for="password">Password</label>
        <input class="field-input" id="password" type="password" autocomplete="current-password" required>

        <button class="btn" type="submit" id="loginBtn">Log In</button>
        <p class="error-note" id="loginError"></p>
      </form>
      <p class="back-link"><a href="redeem-portal.html">Have a company code? Enter it to see your portal →</a></p>
      <p class="back-link"><a href="index.html">← Back to the site</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="sb.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('loginBtn');
      var errEl = document.getElementById('loginError');
      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      try {
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        var { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });

        if (error) {
          errEl.textContent = 'Couldn\'t log in — check your email and password and try again.';
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Log In';
          return;
        }

        var uid = data.user.id;

        // Admin account?
        var { data: admin } = await sb.from('admins').select('id').eq('id', uid).maybeSingle();
        if (admin) {
          window.location.href = 'admin.html';
          return;
        }

        // Client account?
        var { data: client } = await sb.from('clients').select('care_plan_active').eq('id', uid).maybeSingle();
        if (client) {
          window.location.href = client.care_plan_active ? 'customer-portal.html' : 'customer-portal-standard.html';
          return;
        }

        // Neither — no portal access set up for this login yet.
        await sb.auth.signOut();
        errEl.textContent = 'This account isn\'t linked to a client or admin profile yet. Reach out and we\'ll get it set up.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Log In';
      } catch (err) {
        errEl.textContent = 'Could not reach the server. Check your connection and try again.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>

</body>
</html>
